{% extends 'base.html' %}

{% block title %}Niveaux | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="container section-spacing">
  <div class="section-heading">
    <div>
      <span class="eyebrow">Niveaux</span>
      <h1 class="page-title">Explorer par niveau</h1>
    </div>
  </div>

  <div class="row g-3">
    {% for level in levels %}
    <div class="col-6 col-md-4 col-lg-3">
      <a href="{{ url_for('public.documents_page', level_id=level.id) }}" class="level-card">
        {{ level.name }}
      </a>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
