{% extends 'admin/layout.html' %}

{% block title %}Modifier document{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <span class="eyebrow">Modification</span>
        <h1 class="page-title">Modifier le document</h1>
    </div>
</div>

<div class="admin-panel">
    <form method="post" enctype="multipart/form-data">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Titre</label>
                <input type="text" name="title" class="form-control" value="{{ document.title }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Auteur</label>
                <input type="text" name="author" class="form-control" value="{{ document.author or '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4">{{ document.description or '' }}</textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">Matière</label>
                <select name="subject_id" class="form-select">
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if document.subject_id == subject.id %}selected{% endif %}>{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Niveau</label>
                <select name="level_id" class="form-select">
                    {% for level in levels %}
                    <option value="{{ level.id }}" {% if document.level_id == level.id %}selected{% endif %}>{{ level.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Type</label>
                <select name="document_type_id" class="form-select">
                    {% for doc_type in document_types %}
                    <option value="{{ doc_type.id }}" {% if document.document_type_id == doc_type.id %}selected{% endif %}>{{ doc_type.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Année scolaire</label>
                <input type="text" name="school_year" class="form-control" value="{{ document.school_year or '' }}">
            </div>
            <div class="col-md-8">
                <label class="form-label">Tags (séparés par des virgules)</label>
                <input type="text" name="tags" class="form-control" value="{% for tag in document.tags %}{{ tag.name }}{% if not loop.last %}, {% endif %}{% endfor %}">
            </div>
            <div class="col-12">
                <label class="form-label">Remplacer le fichier</label>
                <input type="file" name="file" class="form-control">
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="is_visible" {% if document.is_visible %}checked{% endif %}>
                    <label class="form-check-label">Visible</label>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="is_featured" {% if document.is_featured %}checked{% endif %}>
                    <label class="form-check-label">Mis en avant</label>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="allow_download" {% if document.allow_download %}checked{% endif %}>
                    <label class="form-check-label">Téléchargement</label>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="is_pinned" {% if document.is_pinned %}checked{% endif %}>
                    <label class="form-check-label">Épingler</label>
                </div>
            </div>
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{{ url_for('admin.documents') }}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
