version: '3.9'

services:
  db:
    image: mysql:8.0.27
    container_name: mohamed_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mohamed
      MYSQL_USER: mohamed
      MYSQL_PASSWORD: mohamed_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mohamed_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      MYSQL_DATABASE: mohamed
      SECRET_KEY: change-me-super-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      MAX_CONTENT_LENGTH: 15728640
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
    command: sh -c "python -c \"from app import init_seed_data; init_seed_data()\" || true; python app.py"

volumes:
  mysql_data:
